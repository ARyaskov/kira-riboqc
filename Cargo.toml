[package]
name = "kira-riboqc"
description = "Deterministic ribosome and translation-state quality control for single-cell RNA-seq."
version = "0.2.0"
rust-version = "1.95"
edition = "2024"
license = "MIT"
repository = "https://github.com/ARyaskov/kira-riboqc"
keywords = [
    "bioinformatics",
    "ribosome",
    "translation",
    "sc-rna",
    "oncology"
]
categories = [
    "science",
    "science::bioinformatics",
    "science::bioinformatics::genomics",
    "command-line-utilities"
]

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
csv = "1"
flate2 = { version = "1", features = ["zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
rustc-hash = "2"
ryu = "1"
itoa = "1"
kira-shared-sc-cache = "0.2.1" 
kira-scio = "0.2.1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "kira-riboqc"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
